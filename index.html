<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>몽실이 AR</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gothic+A1:wght@400;700;800&display=swap">
<style>
/* Layout: one-screen AR viewfinder — canvas fills the screen, a status card floats on top, an action dock with a shutter sits at the bottom. Ink-on-paper monochrome. */
:root{
  --paper:#ffffff;
  --ink:#111111;
  --ink-soft:#5c5c5c;
  --line:#d6d6d6;
  --wash:#f2f2f2;
  --veil:rgba(17,17,17,.55);
  --display:"Jua","Gothic A1",system-ui,sans-serif;
  --body:"Gothic A1",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --radius:18px;
  color-scheme:light;
}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
.app{position:relative;height:100%;overflow:hidden;background:var(--paper)}
#stage{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#stage.dragging{cursor:grabbing}
video,#fileIn{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}

/* top status card */
.top{position:absolute;top:0;left:0;right:0;padding-block:12px 0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));pointer-events:none;display:flex;flex-direction:column;gap:8px}
.card{pointer-events:auto;background:var(--paper);border:2px solid var(--ink);border-radius:var(--radius);padding:12px 14px;display:flex;flex-direction:column;gap:10px;max-width:520px;width:100%;margin-inline:auto;box-shadow:4px 4px 0 var(--ink)}
.row{display:flex;align-items:center;gap:10px;min-width:0}
.name{font-family:var(--display);font-size:24px;line-height:1;background:none;border:0;padding:0;color:var(--ink);cursor:pointer;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.name:focus-visible,button:focus-visible,label:focus-visible{outline:3px solid var(--ink);outline-offset:3px;border-radius:8px}
#nameIn{font-family:var(--display);font-size:22px;border:0;border-bottom:2px solid var(--ink);background:transparent;color:var(--ink);width:9em;padding:0 0 2px;outline:none}
.chip{flex:none;font-size:12px;font-weight:800;letter-spacing:.04em;background:var(--ink);color:var(--paper);border-radius:999px;padding:4px 9px;font-variant-numeric:tabular-nums}
.xp{margin-left:auto;flex:1;max-width:140px;min-width:70px;display:flex;flex-direction:column;gap:3px}
.xp small{font-size:10px;font-weight:700;color:var(--ink-soft);text-align:right;font-variant-numeric:tabular-nums;letter-spacing:.03em}
.bar{height:8px;border:1.5px solid var(--ink);border-radius:99px;overflow:hidden;background:var(--paper)}
.bar i{display:block;height:100%;width:50%;background:var(--ink);border-radius:99px;transition:width .4s ease}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat{display:flex;flex-direction:column;gap:4px;min-width:0}
.stat .lab{display:flex;justify-content:space-between;font-size:11px;font-weight:800;letter-spacing:.02em}
.stat .lab b{font-weight:700;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.stat.low .bar i{background:repeating-linear-gradient(-45deg,var(--ink) 0 4px,var(--paper) 4px 7px)}
.stat.low .lab span::after{content:" !";}
.hint{pointer-events:auto;align-self:center;font-size:12px;font-weight:700;background:var(--paper);border:1.5px solid var(--ink);border-radius:999px;padding:6px 12px;text-align:center;max-width:100%}

/* bubble */
#bubble{position:absolute;left:0;top:0;pointer-events:none;background:var(--paper);border:2px solid var(--ink);border-radius:14px;padding:7px 11px;font-family:var(--display);font-size:16px;white-space:nowrap;transform-origin:50% 100%;transition:opacity .2s}
#bubble::after{content:"";position:absolute;left:50%;bottom:-8px;width:12px;height:12px;background:var(--paper);border-right:2px solid var(--ink);border-bottom:2px solid var(--ink);transform:translateX(-50%) rotate(45deg)}

/* dock */
.dock{position:absolute;left:0;right:0;bottom:0;padding-block:0 14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;justify-content:center;pointer-events:none}
.dock-in{pointer-events:auto;display:grid;grid-template-columns:repeat(2,minmax(0,1fr)) auto repeat(2,minmax(0,1fr));align-items:end;gap:8px;width:100%;max-width:520px}
.act{appearance:none;background:var(--paper);color:var(--ink);border:2px solid var(--ink);border-radius:16px;padding:9px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:4px;font:800 12px/1 var(--body);cursor:pointer;box-shadow:3px 3px 0 var(--ink);transition:transform .08s,box-shadow .08s}
.act svg{width:24px;height:24px}
.act:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--ink)}
.act[disabled]{opacity:.35;cursor:not-allowed;box-shadow:none}
.act.on{background:var(--ink);color:var(--paper)}
.shutter{appearance:none;width:72px;height:72px;border-radius:50%;border:3px solid var(--ink);background:var(--paper);display:grid;place-items:center;cursor:pointer;padding:0;margin-bottom:2px;box-shadow:3px 3px 0 var(--ink)}
.shutter span{width:54px;height:54px;border-radius:50%;background:var(--ink);display:grid;place-items:center;color:var(--paper)}
.shutter svg{width:24px;height:24px}
.shutter:active{transform:translate(3px,3px);box-shadow:none}

/* toast + sheets */
#toast{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%) scale(.9);background:var(--ink);color:var(--paper);font-family:var(--display);font-size:22px;padding:12px 20px;border-radius:16px;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;text-align:center;max-width:calc(100% - 32px)}
#toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
#flash{position:absolute;inset:0;background:var(--paper);opacity:0;pointer-events:none;transition:opacity .35s}
.sheet{position:absolute;inset:0;background:var(--veil);display:flex;align-items:flex-end;justify-content:center;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px;z-index:5}
.sheet-in{background:var(--paper);border:2px solid var(--ink);border-radius:22px;padding:20px;width:100%;max-width:440px;display:flex;flex-direction:column;gap:12px;box-shadow:5px 5px 0 var(--ink)}
.sheet h2{margin:0;font-family:var(--display);font-weight:400;font-size:22px;text-wrap:balance}
.sheet p{margin:0;font-size:14px;line-height:1.6;color:var(--ink-soft)}
.btn{appearance:none;display:flex;align-items:center;justify-content:center;gap:8px;font:800 15px/1 var(--body);border:2px solid var(--ink);border-radius:14px;padding:14px;cursor:pointer;background:var(--paper);color:var(--ink);text-align:center}
.btn.primary{background:var(--ink);color:var(--paper)}
.btn svg{width:20px;height:20px}
.note{font-size:12px!important;border-top:1.5px dashed var(--line);padding-top:10px}
#shotImg{width:100%;border:2px solid var(--ink);border-radius:12px;display:block}

@media (max-width:360px){.act{font-size:11px}.act svg{width:20px;height:20px}.shutter{width:62px;height:62px}.shutter span{width:46px;height:46px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>


<div class="app" id="app">
  <canvas id="stage" aria-label="몽실이가 있는 AR 화면. 탭하면 쓰다듬고, 끌어서 옮길 수 있어요."></canvas>
  <video id="video" playsinline muted></video>
  <input type="file" id="fileIn" accept="image/*" capture="environment">

  <div class="top">
    <div class="card">
      <div class="row">
        <button class="name" id="nameBtn" title="이름 바꾸기">몽실이</button>
        <input id="nameIn" maxlength="10" hidden aria-label="새 이름">
        <span class="chip" id="lvChip">알</span>
        <div class="xp">
          <div class="bar"><i id="xpBar"></i></div>
          <small id="xpTxt">0 / 50 XP</small>
        </div>
      </div>
      <div class="stats">
        <div class="stat" id="stFood"><div class="lab"><span>포만감</span><b>70</b></div><div class="bar"><i></i></div></div>
        <div class="stat" id="stMood"><div class="lab"><span>기분</span><b>70</b></div><div class="bar"><i></i></div></div>
        <div class="stat" id="stEnergy"><div class="lab"><span>에너지</span><b>80</b></div><div class="bar"><i></i></div></div>
      </div>
    </div>
    <div class="hint" id="hint">알을 톡톡 두드려 깨워주세요 · 0/5</div>
  </div>

  <div id="bubble" style="opacity:0">안녕!</div>
  <div id="flash"></div>
  <div id="toast"></div>

  <div class="dock">
    <div class="dock-in">
      <button class="act" id="bFeed"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 3.5c-1.2 0-2 .8-2.6 1.8L4 15c-1.2 2.1.3 4.5 2.7 4.5h10.6c2.4 0 3.9-2.4 2.7-4.5l-5.4-9.7C14 4.3 13.2 3.5 12 3.5Z"/><path d="M8 19.5v-4h8v4" fill="currentColor"/></svg>먹이</button>
      <button class="act" id="bPlay"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="8.5"/><path d="M4 10.5c5 2.5 11 2.5 16 0M5.5 16.5c4-1.8 9-1.8 13 0"/></svg>놀기</button>
      <button class="shutter" id="bShot" aria-label="사진 찍기"><span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 8h3l1.5-2.5h7L17 8h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg></span></button>
      <button class="act" id="bSleep"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M19 14.5A7.5 7.5 0 0 1 9.5 5a7.5 7.5 0 1 0 9.5 9.5Z"/></svg><span id="sleepLab">재우기</span></button>
      <button class="act" id="bCam"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 8V5h3M17 5h3v3M20 16v3h-3M7 19H4v-3"/><circle cx="12" cy="12" r="3"/></svg><span id="camLab">카메라</span></button>
    </div>
  </div>

  <div class="sheet" id="camSheet" hidden>
    <div class="sheet-in" role="dialog" aria-labelledby="camTitle">
      <h2 id="camTitle">사진 위에 몽실이를 올려볼까요?</h2>
      <p id="camDesc">이 화면에서는 실시간 카메라가 막혀 있어요. 대신 지금 사진을 찍으면 그 장면 속에 몽실이가 나타나요.</p>
      <label class="btn primary" for="fileIn" id="pickBtn" tabindex="0"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 8h3l1.5-2.5h7L17 8h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>사진 찍기 · 고르기</label>
      <button class="btn" id="clearBg" hidden>원래 AR 바닥으로 돌아가기</button>
      <button class="btn" id="closeSheet">닫기</button>
      <p class="note">실시간 카메라와 폰을 돌리면 몽실이가 그 자리에 머무는 AR 모드는, 이 파일을 내 웹사이트(예: GitHub Pages)에 올려 휴대폰으로 열면 작동해요.</p>
    </div>
  </div>

  <div class="sheet" id="shotSheet" hidden>
    <div class="sheet-in" role="dialog" aria-labelledby="shotTitle">
      <h2 id="shotTitle">찰칵! 기념사진</h2>
      <img id="shotImg" alt="몽실이 기념사진">
      <p>사진을 길게 눌러 저장하세요.</p>
      <button class="btn primary" id="closeShot">닫기</button>
    </div>
  </div>
</div>

<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const cv = $('#stage'), ctx = cv.getContext('2d');
const video = $('#video');
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const INK = '#111111', PAPER = '#ffffff', CHEEK = '#d4d4d4';
const STAGES = ['알', '아기', '어린이', '어른'];
const SCALE = [0.95, 0.78, 1.0, 1.25];

/* ---------- save data ---------- */
const KEY = 'mongsil-ar-v1';
const DEF = { name: '몽실이', level: 1, xp: 0, stage: 0, taps: 0, food: 70, mood: 70, energy: 80, sleeping: false, last: Date.now() };
let S;
try { S = Object.assign({}, DEF, JSON.parse(localStorage.getItem(KEY) || 'null') || {}); } catch (e) { S = Object.assign({}, DEF); }
function save() { try { S.last = Date.now(); localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const need = l => 30 + l * 20;
const stageFor = l => (l <= 2 ? 1 : l <= 5 ? 2 : 3);

function tick(sec) {
  if (S.stage === 0) return;
  const m = sec / 60;
  if (S.sleeping) {
    S.energy += 3 * m; S.food -= 0.5 * m; S.mood -= 0.15 * m;
  } else {
    S.food -= 1.2 * m; S.energy -= 0.6 * m;
    S.mood -= (S.food < 20 ? 1.6 : 0.7) * m;
  }
  S.food = clamp(S.food, 0, 100); S.mood = clamp(S.mood, 0, 100); S.energy = clamp(S.energy, 0, 100);
}
// catch up time while away (max 12h)
tick(Math.min(720, Math.max(0, (Date.now() - S.last) / 60000)) * 60);
let wokeWhileAway = false;
if (S.sleeping && S.energy >= 100) { S.sleeping = false; wokeWhileAway = true; }

/* ---------- canvas sizing ---------- */
let W = 0, H = 0, DPR = 1;
const pet = { wx: 0, wy: 0, placed: false };
function R() { return clamp(Math.min(W, H) * 0.12, 34, 88) * SCALE[S.stage]; }
function resize() {
  const r = cv.getBoundingClientRect();
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = r.width; H = r.height;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  if (!pet.placed) { pet.wx = W / 2; pet.wy = H * 0.66; pet.placed = true; }
  if (!gyro.on) { pet.wx = clamp(pet.wx, 40, W - 40); pet.wy = clamp(pet.wy, H * 0.4, H - 120); }
}

/* ---------- gyro (world-anchored AR when live camera) ---------- */
const gyro = { on: false, base: null, dx: 0, dy: 0, tx: 0, ty: 0 };
const ppd = () => W / 55;
function onOrient(e) {
  if (e.alpha == null || e.beta == null) return;
  if (!gyro.base) gyro.base = { a: e.alpha, b: e.beta };
  let da = e.alpha - gyro.base.a;
  if (da > 180) da -= 360; if (da < -180) da += 360;
  gyro.tx = da; gyro.ty = e.beta - gyro.base.b;
  gyro.on = true;
}
function requestGyro() {
  try {
    const D = window.DeviceOrientationEvent;
    if (D && typeof D.requestPermission === 'function') {
      return D.requestPermission().then(p => { if (p === 'granted') addEventListener('deviceorientation', onOrient); }).catch(() => {});
    }
    if (D) addEventListener('deviceorientation', onOrient);
  } catch (e) {}
  return Promise.resolve();
}
function stopGyro() { removeEventListener('deviceorientation', onOrient); recenterGyro(); gyro.on = false; }
function recenterGyro() {
  const p = petScreen();
  gyro.base = null; gyro.dx = gyro.dy = gyro.tx = gyro.ty = 0;
  pet.wx = p.x; pet.wy = p.y;
}
function petScreen() {
  let x = pet.wx, y = pet.wy;
  if (gyro.on) { x += gyro.dx * ppd(); y += gyro.dy * ppd(); }
  return { x, y };
}

/* ---------- animation state ---------- */
const A = {
  t: 0, blinkAt: 2, blink: 0, wobble: 0, happyUntil: 0, chomp: 0,
  jump: null, squashKick: 0, flash: 0,
  parts: [], foods: [], ball: null, cracks: []
};
function makeCracks() {
  A.cracks = [];
  for (let i = 0; i < 5; i++) {
    const pts = []; const sx = (Math.random() - 0.5) * 0.9; let x = sx, y = -1.2 + Math.random() * 0.5;
    pts.push([x, y]);
    for (let k = 0; k < 4; k++) { x += (k % 2 ? 0.14 : -0.14) + (Math.random() - 0.5) * 0.06; y += 0.12 + Math.random() * 0.06; pts.push([x, y]); }
    A.cracks.push(pts);
  }
}
makeCracks();

/* ---------- speech ---------- */
const bubble = $('#bubble');
let speech = { text: '', until: 0 };
function say(text, sec = 2.2) { speech = { text, until: A.t + sec }; bubble.textContent = text; }
const pick = a => a[(Math.random() * a.length) | 0];

/* ---------- particles ---------- */
function burst(kind, x, y, n) {
  for (let i = 0; i < n; i++) {
    const ang = -Math.PI / 2 + (Math.random() - 0.5) * 1.8;
    const sp = 60 + Math.random() * 110;
    A.parts.push({ kind, x, y, vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp, life: 0, max: 0.9 + Math.random() * 0.6, s: 0.7 + Math.random() * 0.6, rot: Math.random() * 6 });
  }
}

/* ---------- actions ---------- */
function toast(t) { const el = $('#toast'); el.textContent = t; el.classList.add('show'); clearTimeout(toast._t); toast._t = setTimeout(() => el.classList.remove('show'), 1700); }
function addXp(n) {
  if (S.stage === 0) return;
  S.xp += n;
  let leveled = false;
  while (S.xp >= need(S.level)) { S.xp -= need(S.level); S.level++; leveled = true; }
  if (leveled) {
    const ns = stageFor(S.level);
    const p = petScreen();
    if (ns !== S.stage) {
      S.stage = ns; A.flash = 1; burst('star', p.x, p.y - R(), 18);
      toast(`${S.name}가 ${STAGES[ns]}(으)로 자랐어요!`);
      say(pick(['나 컸지?', '키가 쑥!', '몸이 근질근질해']), 2.6);
    } else {
      burst('star', p.x, p.y - R(), 10);
      toast(`레벨 업! Lv.${S.level}`);
    }
  }
  save(); syncUI();
}
function hatch() {
  S.stage = 1; S.level = 1; S.xp = 0; S.food = 80; S.mood = 90; S.energy = 80;
  A.flash = 1; A.happyUntil = A.t + 3;
  const p = petScreen();
  burst('shell', p.x, p.y - R(), 14); burst('star', p.x, p.y - R(), 10);
  toast('알이 깨어났어요!');
  setTimeout(() => say(`안녕! 나는 ${S.name}야`, 3), 500);
  save(); syncUI();
}
function tapPet() {
  const p = petScreen();
  if (S.stage === 0) {
    S.taps++; A.wobble = 1;
    burst('dust', p.x, p.y - R() * 0.4, 4);
    if (S.taps >= 5) hatch(); else { save(); syncUI(); }
    return;
  }
  if (S.sleeping) { say('쿨... 쿨...', 1.5); return; }
  if (A.t - (tapPet._last || -9) < 0.45) return;
  tapPet._last = A.t;
  S.mood = clamp(S.mood + 5, 0, 100); A.happyUntil = A.t + 1.6; A.squashKick = 1;
  burst('heart', p.x, p.y - R() * 1.6, 3);
  if (Math.random() < 0.35) say(pick(['헤헤', '간지러워!', '좋아좋아', '또 해줘', '♡']), 1.6);
  addXp(2);
}
function feed() {
  if (S.stage === 0) return;
  if (S.sleeping) { say('쿨쿨... 자는 중이야', 1.8); return; }
  if (S.food >= 95) { say(pick(['배불러...', '더는 못 먹어!']), 1.8); return; }
  if (A.foods.length) return;
  const p = petScreen();
  A.foods.push({ x: p.x + (Math.random() - 0.5) * 20, y: -40, vy: 0, rot: (Math.random() - 0.5) * 0.6, target: p.y - R() * 0.9 });
  say(pick(['밥이다!', '냠냠 준비!', '오니기리!']), 1.4);
}
function eat() {
  const p = petScreen();
  S.food = clamp(S.food + 25, 0, 100); S.mood = clamp(S.mood + 6, 0, 100);
  A.chomp = 1.1; A.happyUntil = A.t + 1.8;
  burst('crumb', p.x, p.y - R() * 0.8, 8);
  setTimeout(() => say(pick(['맛있다!', '냠냠 최고', '한 개 더?']), 1.6), 700);
  addXp(8);
}
function play() {
  if (S.stage === 0) return;
  if (S.sleeping) { say('지금은 졸려...', 1.6); return; }
  if (S.energy < 15) { say('힘이 없어... 재워줘', 2); return; }
  if (A.ball) return;
  A.ball = { t: 0, dur: 2.7 };
  A.jump = { t: 0, dur: 2.7, n: 3 };
  say(pick(['공놀이다!', '받아라!', '신난다!']), 1.4);
}
function endPlay() {

/* ---------- props & particles ---------- */

/* ---------- main loop ---------- */

  if (uiAcc > 0.5) { uiAcc = 0; syncUI(); }
  if (saveAcc > 4) { saveAcc = 0; save(); }
  if (gyro.on) { gyro.dx += (gyro.tx - gyro.dx) * 0.3; gyro.dy += (gyro.ty - gyro.dy) * 0.3; }

  }
  // ball
  if (A.ball) {
    const b = A.ball; b.t += dt; const ps = petScreen();
    const ph = (b.t / b.dur) * 3; const k = Math.floor(ph), f = ph % 1, dir = k % 2 ? -1 : 1;
    const x = ps.x + dir * (-1.7 + f * 3.4) * r, y = ps.y - r * 2.4 - Math.sin(f * Math.PI) * r * 1.6;
    drawBall(x, y, r * 0.26, b.t * 8 * dir);
    if (b.t >= b.dur) { A.ball = null; endPlay(); }
  }
  if (S.sleeping) drawZzz(body.x, body.y, r);
  drawParts(dt);
  arrow = gyro.on ? drawOffscreen(petScreen()) : null;

  // speech bubble
  if (A.t < speech.until && !arrow) {
    bubble.style.opacity = 1;
    const bw = bubble.offsetWidth, bh = bubble.offsetHeight;
    const bx = clamp(body.x - bw / 2, 8, W - bw - 8);
    const by = Math.max(8, body.y - r * (S.stage === 3 ? 2.7 : 2.35) - bh - 10);
    bubble.style.transform = `translate(${bx}px, ${by}px)`;
  } else bubble.style.opacity = 0;

  $('#flash').style.opacity = A.flash > 0 ? Math.min(1, A.flash) * 0.85 : 0;
  requestAnimationFrame(frame);
}

/* ---------- pointer: tap to pet, drag to move ---------- */
const drag = { active: false, id: null, sx: 0, sy: 0, ox: 0, oy: 0, onPet: false, moved: false };
function hitPet(x, y) {
  const p = petScreen(), r = R();
  const dx = x - p.x, dy = y - (p.y - r);
  return (dx * dx) / (r * 1.3 * r * 1.3) + (dy * dy) / (r * 1.3 * r * 1.3) <= 1;
}
function local(e) { const b = cv.getBoundingClientRect(); return { x: e.clientX - b.left, y: e.clientY - b.top }; }
cv.addEventListener('pointerdown', e => {
  const q = local(e);
  if (arrow && Math.hypot(q.x - arrow.x, q.y - arrow.y) < 34) { // call pet back to center
    gyro.base = null; gyro.dx = gyro.dy = gyro.tx = gyro.ty = 0; pet.wx = W / 2; pet.wy = H * 0.66;
    say('나 여기 있어!', 1.6); return;
  }
  drag.onPet = hitPet(q.x, q.y);
  if (!drag.onPet) return;
  drag.id = e.pointerId; drag.sx = q.x; drag.sy = q.y; drag.moved = false;
  const p = petScreen(); drag.ox = p.x - q.x; drag.oy = p.y - q.y;
  cv.setPointerCapture(e.pointerId);
});
cv.addEventListener('pointermove', e => {
  if (e.pointerId !== drag.id) return;
  const q = local(e);
  if (!drag.moved && Math.hypot(q.x - drag.sx, q.y - drag.sy) > 8) { drag.moved = true; drag.active = true; cv.classList.add('dragging'); }
  if (drag.active) {
    let x = clamp(q.x + drag.ox, 30, W - 30), y = clamp(q.y + drag.oy, H * 0.3, H - 110);
    if (gyro.on) { x -= gyro.dx * ppd(); y -= gyro.dy * ppd(); }
    pet.wx = x; pet.wy = y;
  }
});
function endDrag(e) {
  if (e.pointerId !== drag.id) return;
  if (!drag.moved && drag.onPet) tapPet();
  if (drag.active) { syncUI._hintDone = true; syncUI(); }
  drag.active = false; drag.id = null; cv.classList.remove('dragging');
}
cv.addEventListener('pointerup', endDrag);
cv.addEventListener('pointercancel', endDrag);

/* ---------- buttons ---------- */
$('#bFeed').addEventListener('click', feed);
$('#bPlay').addEventListener('click', play);
$('#bSleep').addEventListener('click', toggleSleep);
const nameBtn = $('#nameBtn'), nameIn = $('#nameIn');
nameBtn.addEventListener('click', () => { nameIn.value = S.name; nameBtn.hidden = true; nameIn.hidden = false; nameIn.focus(); nameIn.select(); });
function commitName() {
  if (nameIn.hidden) return;
  const v = nameIn.value.trim(); if (v) S.name = v.slice(0, 10);
  nameIn.hidden = true; nameBtn.hidden = false; save(); syncUI();
}
nameIn.addEventListener('keydown', e => { if (e.key === 'Enter') commitName(); if (e.key === 'Escape') { nameIn.value = S.name; commitName(); } });
nameIn.addEventListener('blur', commitName);

/* ---------- snapshot ---------- */
let downloads = null;
try { if (window.claude && typeof window.claude.use === 'function') window.claude.use('downloads').then(d => { downloads = d; }).catch(() => {}); } catch (e) {}
const inFrame = (() => { try { return window.self !== window.top; } catch (e) { return true; } })();
$('#bShot').addEventListener('click', async () => {
  // compose a stamped copy
  const out = document.createElement('canvas'); out.width = cv.width; out.height = cv.height;
  const o = out.getContext('2d'); o.drawImage(cv, 0, 0);
  const s = DPR; const label = S.stage === 0 ? `${S.name} · 알` : `${S.name} · Lv.${S.level} ${STAGES[S.stage]}`;
  o.font = `${16 * s}px Jua, sans-serif`; const tw = o.measureText(label).width;
  o.fillStyle = PAPER; o.strokeStyle = INK; o.lineWidth = 2 * s;
  const bx = 14 * s, by = out.height - 46 * s, bw = tw + 24 * s, bh = 32 * s;
  o.beginPath(); o.roundRect ? o.roundRect(bx, by, bw, bh, 16 * s) : o.rect(bx, by, bw, bh); o.fill(); o.stroke();
  o.fillStyle = INK; o.textBaseline = 'middle'; o.fillText(label, bx + 12 * s, by + bh / 2 + 1 * s);
  A.flash = 0.7;
  if (S.stage > 0) { A.happyUntil = A.t + 1.5; say(pick(['브이!', '찰칵!', '잘 나왔어?']), 1.4); }
  const blob = await new Promise(res => out.toBlob(res, 'image/png'));
  if (!blob) return;
  if (downloads) {
    try { await downloads.save({ filename: `${S.name}-AR.png`, data: blob }); toast('사진을 저장했어요'); return; }
    catch (err) { if (err && err.code === 'declined') return; }
  }
  if (!inFrame) {
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `${S.name}-AR.png`;
    document.body.appendChild(a); a.click(); a.remove(); toast('사진을 저장했어요'); return;
  }
  $('#shotImg').src = URL.createObjectURL(blob); $('#shotSheet').hidden = false;
});
$('#closeShot').addEventListener('click', () => $('#shotSheet').hidden = true);

/* ---------- boot ---------- */
addEventListener('resize', resize);
document.addEventListener('visibilitychange', () => { if (document.hidden) save(); });
addEventListener('pagehide', save);
resize(); syncUI();
if (wokeWhileAway) say('푹 잤어! 보고 싶었어', 2.6);
else if (S.stage > 0) setTimeout(() => say(pick([`${S.name} 왔어!`, '또 왔구나!', '놀아줘!']), 2), 600);
requestAnimationFrame(t => { lastT = t; requestAnimationFrame(frame); });
})();
</script>
